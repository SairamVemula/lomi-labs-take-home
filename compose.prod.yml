# Production overlay: docker compose -f compose.yml -f compose.prod.yml up -d
# Every secret comes from ~/lomi/.env on the VPS (written by the deploy workflow); there are no defaults.
# Nothing here publishes a port. The VPS already runs one shared Caddy on 80/443 for every project; `web`
# joins that proxy's Docker network (EDGE_NETWORK) as `lomi-web`, and the shared Caddyfile carries the
# lomi.sairam.cc block (see ./Caddyfile). The api must never be reachable from outside: its login throttle
# trusts X-Forwarded-For, which is only trustworthy when every hop is ours (caddy -> web rewrite -> api).
x-prod-env: &prod-env
  AUTH_MODE: byok
  PUBLIC_ORIGIN: https://lomi.sairam.cc
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/postgres
  SESSION_SECRET: ${SESSION_SECRET:?set in .env}
  KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:?set in .env}

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}

  redis:
    restart: unless-stopped

  # AUTH_MODE=byok: boot.ts migrates and skips seeding.
  migrate:
    build: !reset null
    image: ghcr.io/sairamvemula/lomi-api:${IMAGE_TAG:-latest}
    environment: *prod-env

  api:
    build: !reset null
    image: ghcr.io/sairamvemula/lomi-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *prod-env
      TRUST_PROXY_HOPS: "2"

  worker:
    build: !reset null
    image: ghcr.io/sairamvemula/lomi-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *prod-env

  web:
    build: !reset null
    image: ghcr.io/sairamvemula/lomi-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports: !reset []
    networks:
      default: {}
      edge:
        aliases: [lomi-web]

networks:
  # The shared reverse proxy's network (created by the project that owns that Caddy).
  edge:
    external: true
    name: ${EDGE_NETWORK:-booksland-sales-tracker_bookstore_net}
