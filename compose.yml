# `docker compose up --build` works with no .env file: every value below has a safe local default.
# The SESSION_SECRET / KEY_ENCRYPTION_KEY defaults are DEV-ONLY placeholders; set real ones for anything public.
x-app-env: &app-env
  AUTH_MODE: ${AUTH_MODE:-local}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
  REDIS_URL: redis://redis:6379
  SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789abcdef}
  KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff} # DEV ONLY
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-}
  STORAGE_DIR: /data/files
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Persistence is off on purpose: Postgres is the system of record; the queue is rebuilt by the worker's reconciler.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: migrations, then (AUTH_MODE=local) local user + version 1 of the sample documents. Idempotent.
  # Reuses the api image (it carries packages/db and assignment/fixtures).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: lomi-api
    command: ["node", "packages/db/dist/boot.js"]
    restart: "no"
    environment: *app-env
    volumes:
      - files:/data/files
    depends_on:
      postgres: { condition: service_healthy }
      # Only present with --profile s3: the bucket must exist before seeding writes to it.
      rustfs-init: { condition: service_completed_successfully, required: false }

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: lomi-api
    restart: unless-stopped
    stop_grace_period: 15s
    # Lets the Ollama preset (http://host.docker.internal:11434/v1) reach a host-side Ollama.
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *app-env
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    volumes:
      - files:/data/files
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: lomi-worker
    restart: unless-stopped
    # The worker drains in-flight jobs for up to 8s on SIGTERM.
    stop_grace_period: 15s
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: *app-env
    volumes:
      - files:/data/files
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:3001
    image: lomi-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: { condition: service_healthy }

  # Optional S3-compatible storage: `docker compose --profile s3 up`, with S3_* set (see README).
  rustfs:
    profiles: [s3]
    image: rustfs/rustfs
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin

  rustfs-init:
    profiles: [s3]
    image: lomi-api
    working_dir: /app/packages/storage
    restart: "no"
    depends_on:
      - rustfs
    environment:
      S3_ENDPOINT: http://rustfs:9000
    command:
      - node
      - --input-type=module
      - -e
      - |
        import { S3Client, CreateBucketCommand, HeadBucketCommand } from "@aws-sdk/client-s3";
        const c = new S3Client({ endpoint: process.env.S3_ENDPOINT, region: "us-east-1", forcePathStyle: true,
          credentials: { accessKeyId: "minioadmin", secretAccessKey: "minioadmin" } });
        for (let i = 0; i < 60; i++) {
          try {
            try { await c.send(new HeadBucketCommand({ Bucket: "lomi" })); }
            catch { await c.send(new CreateBucketCommand({ Bucket: "lomi" })); }
            console.log("bucket lomi ready"); process.exit(0);
          } catch (e) { await new Promise((r) => setTimeout(r, 1000)); }
        }
        process.exit(1);

volumes:
  pgdata:
  files:
