name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck test build
      - run: pnpm turbo test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: compose.yml:compose.e2e.yml
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --build
      - name: Wait for web
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3000/api/documents >/dev/null && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1
      - run: pnpm --filter @lomi/web exec playwright install --with-deps chromium
      - run: pnpm --filter @lomi/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          if-no-files-found: ignore
      - name: Compose logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
